rvicio]</text><text x="140.0" y="527" font-size="13.5" fill="#0b2440" text-anchor="middle">Respuestas de lectura</text><rect x="250" y="460" width="180" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5"/><text x="340.0" y="486" font-size="16.5" font-weight="bold" fill="#0b2440" text-anchor="middle">Avisos</text><text x="340.0" y="505" font-size="12.5" fill="#0b2440" text-anchor="middle" opacity="0.92">[Servicio]</text><text x="340.0" y="527" font-size="13.5" fill="#0b2440" text-anchor="middle">Doble confirmación,</text><text x="340.0" y="544" font-size="13.5" fill="#0b2440" text-anchor="middle">baja en un clic</text><rect x="450" y="460" width="180" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5"/><text x="540.0" y="486" font-size="16.5" font-weight="bold" fill="#0b2440" text-anchor="middle">Verificación de</text><text x="540.0" y="505" font-size="16.5" font-weight="bold" fill="#0b2440" text-anchor="middle">fotos</text><text x="540.0" y="524" font-size="12.5" fill="#0b2440" text-anchor="middle" opacity="0.92">[Servicio]</text><text x="540.0" y="546" font-size="13.5" fill="#0b2440" text-anchor="middle">GPS a 3 km, menos de 72</text><text x="540.0" y="563" font-size="13.5" fill="#0b2440" text-anchor="middle">h, duplicados</text><rect x="670" y="460" width="200" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5"/><text x="770.0" y="486" font-size="16.5" font-weight="bold" fill="#0b2440" text-anchor="middle">Cuentas y sesiones</text><text x="770.0" y="505" font-size="12.5" fill="#0b2440" text-anchor="middle" opacity="0.92">[Servicio]</text><text x="770.0" y="527" font-size="13.5" fill="#0b2440" text-anchor="middle">Argon2id, cookie HttpOnly,</text><text x="770.0" y="544" font-size="13.5" fill="#0b2440" text-anchor="middle">roles</text><rect x="910" y="460" width="260" height="140" rx="8" fill="#85bbf0" stroke="#5d82a8" stroke-width="1.5"/><text x="1040.0" y="486" font-size="16.5" font-weight="bold" fill="#0