" width="240" height="140" rx="8" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.5"/><text x="1340.0" y="586" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">EmailJS</text><text x="1340.0" y="605" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[Sistema externo: API REST]</text><text x="1340.0" y="627" font-size="13.5" fill="#ffffff" text-anchor="middle">Envía los 5 formularios</text><rect x="1220" y="790" width="240" height="120" rx="8" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.5"/><text x="1340.0" y="816" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Buzón del equipo</text><text x="1340.0" y="835" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[Sistema externo: Gmail]</text><rect x="1220" y="330" width="240" height="120" rx="8" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.5"/><text x="1340.0" y="356" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Esri World Imagery</text><text x="1340.0" y="375" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[Sistema externo: Teselas]</text><text x="60" y="760" font-size="13" font-weight="bold" fill="#333">Leyenda</text><rect x="60" y="772" width="26" height="16" rx="3" fill="#08427b" stroke="#073b6f" stroke-width="1.4"/><text x="94" y="785" font-size="13" fill="#333">Persona</text><rect x="60" y="796" width="26" height="16" rx="3" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.4"/><text x="94" y="809" font-size="13" fill="#333">Contenedor</text><rect x="60" y="820" width="26" height="16" rx="3" fill="#8c8c8c" stroke="#6b6b6b" stroke-width="1.4"/><text x="94" y="833" font-size="13" fill="#333">Sistema externo</text></svg>