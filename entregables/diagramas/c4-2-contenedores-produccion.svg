" text-anchor="middle">API</text><text x="710.0" y="635" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[Python 3.12, FastAPI, SQLAlchemy]</text><text x="710.0" y="657" font-size="13.5" fill="#ffffff" text-anchor="middle">Contrato OpenAPI /api/v1: destinos,</text><text x="710.0" y="674" font-size="13.5" fill="#ffffff" text-anchor="middle">mapa, previsión, avisos, fotos, panel</text><text x="710.0" y="691" font-size="13.5" fill="#ffffff" text-anchor="middle">interno</text><rect x="900" y="590" width="230" height="170" rx="8" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="1015.0" y="616" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Tareas programadas</text><text x="1015.0" y="635" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[Python, APScheduler]</text><text x="1015.0" y="657" font-size="13.5" fill="#ffffff" text-anchor="middle">06:00 ingesta y recálculo de</text><text x="1015.0" y="674" font-size="13.5" fill="#ffffff" text-anchor="middle">la previsión; 07:00 envío de</text><text x="1015.0" y="691" font-size="13.5" fill="#ffffff" text-anchor="middle">avisos</text><path d="M380,854 a150.0,14 0 0,0 300,0 a150.0,14 0 0,0 -300,0 v122 a150.0,14 0 0,0 300,0 v-122" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><path d="M380,854 a150.0,14 0 0,0 300,0" fill="none" stroke="#3c7fc0" stroke-width="1.5"/><text x="530.0" y="886" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Base de datos</text><text x="530.0" y="905" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.92">[PostgreSQL 16 + PostGIS 3.4]</text><text x="530.0" y="927" font-size="13.5" fill="#ffffff" text-anchor="middle">Destinos, zonas, series, previsiones,</text><text x="530.0" y="944" font-size="13.5" fill="#ffffff" text-anchor="middle">avisos, fotos</text><rect x="880" y="850" width="250" height="130" rx="8" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="1005.0" y="876" font-