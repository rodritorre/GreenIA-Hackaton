="middle">Clasifica texto e imagen</text><text x="310.0" y="932.0" font-size="12.5" fill="#333" text-anchor="middle" font-style="italic">[HTTPS]</text><line x1="1130.0" y1="604.7" x2="1285.0" y2="510.0" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1140.1" y="532.9" width="94.8" height="21" rx="4" fill="#ffffff" opacity="0.93"/><text x="1187.5" y="547.9" font-size="12.5" fill="#333" text-anchor="middle">Temperaturas</text><line x1="1130.0" y1="655.8" x2="1280.0" y2="630.8" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1150.7" y="618.8" width="108.6" height="21" rx="4" fill="#ffffff" opacity="0.93"/><text x="1205.0" y="633.8" font-size="12.5" fill="#333" text-anchor="middle">Bandas y nubes</text><line x1="1130.0" y1="706.9" x2="1280.0" y2="748.6" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="6 5"/><rect x="1157.6" y="733.3" width="94.8" height="21" rx="4" fill="#ffffff" opacity="0.93"/><text x="1205.0" y="748.3" font-size="12.5" fill="#333" text-anchor="middle">Envía avisos</text><circle cx="750.0" cy="121" r="24" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/><rect x="620" y="139" width="260" height="106" rx="22" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/><text x="750.0" y="169" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Viajero, negocio, destino u</text><text x="750.0" y="188" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">operador</text><rect x="30" y="300" width="1160" height="720" rx="10" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="8 6"/><text x="44" y="992" font-size="15" font-weight="bold" fill="#333">Cuándo Florece</text><text x="44" y="1010" font-size="12.5" fill="#555">Servidor Linux en la UE con Docker Compose; solo el servidor web es accesible desde internet</text><rect x="70" y="340" width="300" height="160" rx="8" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="220.0" y="366" font-size="1