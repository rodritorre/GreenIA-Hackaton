# Production stack. Run from the repo root via scripts/deploy.sh.
# Phase 1: Caddy only. Future services (api, db, worker) join the `internal` network
# and get a route in the Caddyfile; Caddy stays the only container publishing ports.
name: hackathon

services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/public:/srv:ro
      - caddy_data:/data     # certificates: must persist or Let's Encrypt rate limits bite
      - caddy_config:/config
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
