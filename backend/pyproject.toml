[project]
name = "florece"
version = "0.1.0"
description = "Cuándo Florece API: bloom states, forecasts, alerts and citizen observations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.16",
  "alembic>=1.14",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.17",
  "pillow>=11",
  "httpx>=0.28",
  "numpy>=2",
  "rasterio>=1.4",
  "apscheduler>=3.10,<4",
  "typer>=0.13",
  "mgrs>=1.5",
  "packaging>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
florece = "florece.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["florece*"]

[tool.setuptools.package-data]
florece = ["seed/*.json", "migrations/*.ini", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() defaults are the framework's intended pattern
ignore = ["B008", "E501"]
